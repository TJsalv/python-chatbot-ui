<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Simple AI Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, Arial, sans-serif; max-width: 680px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.25rem; }
    .chat-box { border: 1px solid #ddd; border-radius: 8px; padding: 12px; min-height: 240px; background: #fafafa; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 14px; border: none; background: #2563eb; color: white; border-radius: 6px; cursor: pointer; }
    button:disabled { background: #9aa7d7; cursor: not-allowed; }
    .bubble { padding: 8px 10px; border-radius: 8px; margin: 6px 0; max-width: 90%; }
    .user { background: #e6f2ff; align-self: flex-end; }
    .bot { background: #e9e9e9; align-self: flex-start; }
    .messages { display: flex; flex-direction: column; }
    small { color: #666; }
  </style>
</head>
<body>
  <h1>AI Chatbot</h1>
  <div class="chat-box">
    <div id="messages" class="messages">
      <div class="bubble bot">Hi! Ask me anything. 👋</div>
    </div>
  </div>

  <form id="chat-form" class="row">
    <input id="msg" name="msg" type="text" placeholder="Type your message..." autocomplete="off" required />
    <button id="sendBtn" type="submit">Send</button>
  </form>

  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('msg');
    const sendBtn = document.getElementById('sendBtn');
    const messages = document.getElementById('messages');

    function addBubble(text, role) {
      const div = document.createElement('div');
      div.className = 'bubble ' + role;
      div.textContent = text;
      messages.appendChild(div);
      messages.parentElement.scrollTop = messages.parentElement.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      // show user message
      addBubble(text, 'user');
      input.value = '';
      input.focus();
      sendBtn.disabled = true;

      try {
        // Build form-data to match request.form["msg"]
        const fd = new FormData();
        fd.append('msg', text);

        const res = await fetch('/get', {
          method: 'POST',
          body: fd
        });

        // Your Flask route returns plain text via jsonify/string; handle as text
        const reply = await res.text();
        addBubble(reply || '(no response)', 'bot');
      } catch (err) {
        addBubble('Error: ' + (err?.message || 'Request failed'), 'bot');
      } finally {
        sendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
